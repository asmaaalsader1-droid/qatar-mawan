<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 48" width="400" height="48" role="img" aria-label="Visa, Mastercard, Amex, Apple Pay, Google Pay">
  <defs>
    <style>
      .brand { font-family: Arial, Helvetica, sans-serif; font-weight: 800; }
    </style>
  </defs>

  <!-- VISA -->
  <rect x="2" y="4" width="74" height="40" rx="6" fill="#1A1F71"/>
  <text class="brand" x="12" y="30" font-size="18" letter-spacing="1" fill="#fff">VISA</text>

  <!-- MASTERCARD -->
  <rect x="82" y="4" width="88" height="40" rx="6" fill="#fff" stroke="#E5E7EB" stroke-width="1"/>
  <circle cx="114" cy="24" r="12" fill="#EB001B"/>
  <circle cx="136" cy="24" r="12" fill="#F79E1B" opacity="0.9"/>
  <text class="brand" x="120" y="41" font-size="7" fill="#222" text-anchor="middle" opacity="0">MC</text>

  <!-- AMEX -->
  <rect x="176" y="4" width="74" height="40" rx="6" fill="#1F72CD"/>
  <text class="brand" x="186" y="30" font-size="15" fill="#fff">AMEX</text>

  <!-- APPLE PAY -->
  <rect x="256" y="4" width="72" height="40" rx="6" fill="#fff" stroke="#E5E7EB" stroke-width="1"/>
  <text class="brand" x="262" y="27" font-size="12" fill="#222"> Pay</text>
  <text class="brand" x="266" y="27" font-size="14" fill="#222"> </text>

  <!-- GOOGLE PAY -->
  <rect x="334" y="4" width="64" height="40" rx="6" fill="#fff" stroke="#E5E7EB" stroke-width="1"/>
  <text class="brand" x="340" y="28" font-size="11" fill="#222">G Pay</text>
</svg>